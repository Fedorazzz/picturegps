<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото-Штамп</title>
    <style>
        :root { --primary: #007AFF; --bg: #f4f4f9; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; box-sizing: border-box; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 4px; }
        input[type="text"], input[type="file"], select, textarea { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 9px; box-sizing: border-box; font-size: 0.95rem; font-family: inherit; }
        textarea { height: 60px; resize: vertical; }
        
        .style-panel { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-top: 15px; }
        .style-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;}
        .style-item { flex: 1; min-width: 120px; }
        
        .btn { border: none; border-radius: 9px; font-weight: bold; cursor: pointer; padding: 12px; width: 100%; }
        .btn-search { background: #8e8e93; color: white; font-size: 0.85rem; margin-top: 5px;}
        .btn-main { background: var(--primary); color: white; font-size: 1rem; margin-top: 20px; }
        
        .toggle-btn { background: #eee; border: 1px solid #ccc;}
        .toggle-btn.active { background: #333; color: white; }

        canvas { display: none; width: 100%; margin-top: 25px; border-radius: 15px; }
        .download-btn { display: none; margin-top: 15px; background: #34c759; color: white; text-decoration: none; padding: 14px; text-align: center; border-radius: 10px; font-weight: bold; width: 100%; box-sizing: border-box; }
        #status { font-size: 0.8rem; text-align: center; margin: 10px 0; color: #777; }
    </style>
</head>
<body>

<div class="card">
    <div class="input-group">
        <label>📸 Фотография</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="input-group">
        <label>🔍 Поиск данных</label>
        <input type="text" id="addressSearch" placeholder="Москва, ул. Лесная, 5">
        <button type="button" id="getCoordsBtn" class="btn btn-search">Получить координаты и адрес</button>
    </div>

    <div class="input-group">
        <label>📅 Дата (ДД.ММ.ГГГГ ЧЧ:ММ)</label>
        <input type="text" id="dateInput" placeholder="22.10.2024 14:30">
    </div>

    <div class="input-group">
        <label>🏠 Адрес</label>
        <input type="text" id="addressDisplay">
    </div>

    <div class="input-group">
        <label>🌐 Координаты</label>
        <input type="text" id="coordsInput">
    </div>

    <div class="input-group">
        <label>✍️ Свой текст (Enter для новой строки)</label>
        <textarea id="extraTextInput">Северо-Восточный административный округ&#10;Москва</textarea>
    </div>

    <div class="style-panel">
        <div class="style-row">
            <div class="style-item">
                <label>Шрифт</label>
                <select id="fontFamily">
                    <option value="Arial">Arial</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                </select>
            </div>
            <div class="style-item" style="flex: 0 0 60px;">
                <label>Цвет</label>
                <!-- Установлен желтоватый цвет по умолчанию -->
                <input type="color" id="textColor" value="#fff9c4">
            </div>
            <div class="style-item" style="flex: 0 0 60px;">
                <label>Жирный</label>
                <button type="button" id="boldToggle" class="btn toggle-btn active">B</button>
            </div>
        </div>
        <div class="input-group">
            <label>Размер шрифта: <span id="fontSizeVal">50</span>px</label>
            <input type="range" id="fontSize" min="15" max="150" value="50">
        </div>
    </div>

    <button id="processBtn" class="btn btn-main">Создать фото</button>
    <div id="status"></div>
    <a id="downloadBtn" class="download-btn">⬇ Скачать результат</a>
</div>

<canvas id="canvas"></canvas>

<script>
    const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    const boldToggle = document.getElementById('boldToggle');
    let isBold = true; // Сделаем жирным по умолчанию

    boldToggle.onclick = () => { isBold = !isBold; boldToggle.classList.toggle('active'); };
    document.getElementById('fontSize').oninput = (e) => document.getElementById('fontSizeVal').innerText = e.target.value;

    function formatUserDate(str) {
        if (!str) return "";
        const match = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})$/);
        if (!match) return str;
        const mIdx = parseInt(match[2]) - 1;
        return `${parseInt(match[1])} ${months[mIdx] || ''} ${match[3]} время: ${match[4]}:${match[5]}`;
    }

    document.getElementById('getCoordsBtn').onclick = async () => {
        const q = document.getElementById('addressSearch').value;
        if(!q) return;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(q)}&limit=1`);
            const data = await res.json();
            if (data.length > 0) {
                const a = data[0].address;
                document.getElementById('addressDisplay').value = `${a.house_number || ''} ${a.road || a.suburb || ''}`.trim();
                document.getElementById('coordsInput').value = `${parseFloat(data[0].lat).toFixed(6)}, ${parseFloat(data[0].lon).toFixed(6)}`;
            }
        } catch (e) { console.error(e); }
    };

    document.getElementById('processBtn').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("Выберите фото");

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const fs = parseInt(document.getElementById('fontSize').value);
                const color = document.getElementById('textColor').value;
                ctx.font = `${isBold ? 'bold' : 'normal'} ${fs}px ${document.getElementById('fontFamily').value}`;
                ctx.fillStyle = color;
                ctx.textAlign = "right";
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 8;
                ctx.strokeStyle = "black";
                ctx.lineWidth = fs / 7;

                // Собираем массив строк: сначала дата, потом адрес, потом координаты
                let mainInfo = [
                    formatUserDate(document.getElementById('dateInput').value),
                    document.getElementById('addressDisplay').value,
                    document.getElementById('coordsInput').value
                ];
                
                // Потом разбиваем текст из textarea на строки
                const extraLines = document.getElementById('extraTextInput').value.split('\n');
                
                // Итоговый массив (фильтруем пустые)
                const allLines = [...mainInfo, ...extraLines].filter(line => line.trim() !== "");

                const padding = fs * 1.5;
                const lineSpacing = 1.35;

                // Отрисовываем массив с конца (снизу вверх)
                allLines.reverse().forEach((line, i) => {
                    const x = canvas.width - (fs * 0.8);
                    const y = canvas.height - padding - (i * fs * lineSpacing);
                    ctx.strokeText(line, x, y);
                    ctx.fillText(line, x, y);
                });

                canvas.style.display = "block";
                const btn = document.getElementById('downloadBtn');
                btn.href = canvas.toDataURL('image/jpeg', 0.95);
                btn.download = `photo_${Date.now()}.jpg`;
                btn.style.display = "block";
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
