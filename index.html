<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture GPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark {
            background-color: black;
            color: white;
        }
        .toggle-btn {
            margin: 20px;
            padding: 10px;
            cursor: pointer;
        }
        .error {
            color: red;
        }
        /* Add additional styles for responsiveness and accessibility */
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleTheme()">Toggle Dark/Light Theme</button>
    <div id="error-message" class="error" style="display: none;"></div>

    <script>
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark');
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        }

        function checkTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark');
            }
        }

        window.onload = function() {
            checkTheme();
            // Simulate error handling
            try {
                // Your existing code that may throw an error
            } catch (e) {
                document.getElementById('error-message').innerText = 'An error occurred: ' + e.message;
                document.getElementById('error-message').style.display = 'block';
            }
        };
    </script>
</body>
</html>
