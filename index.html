<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PictureGPS v1.0</title>
    <style>
        :root {
            --primary: #007AFF; --success: #34c759; --bg: #f4f4f9;
            --card-bg: #ffffff; --text-main: #333333; --text-secondary: #555555;
            --input-border: #dddddd; --panel-bg: #f9f9f9; --panel-border: #eeeeee;
        }
        [data-theme="dark"] {
            --bg: #121214; --card-bg: #1e1e20; --text-main: #e4e4e7;
            --text-secondary: #a1a1aa; --input-border: #2e2e32; --panel-bg: #27272a;
            --panel-border: #3f3f46;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif; background: var(--bg);
            color: var(--text-main); margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; transition: background 0.2s;
        }

        .header { 
            width: 100%; max-width: 1300px; margin: 0 auto;
            display: flex; justify-content: flex-start;
            padding: 15px 20px; box-sizing: border-box; 
        }

        .theme-toggle {
            background: var(--card-bg); border: 1px solid var(--input-border);
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-size: 0.85rem; color: var(--text-main); font-weight: 600;
        }

        .main-container {
            display: flex; flex-direction: column; align-items: stretch;
            padding: 15px 20px; width: 100%; box-sizing: border-box; flex-grow: 1;
        }
        
        @media (min-width: 900px) {
            .main-container { flex-direction: row; justify-content: center; gap: 30px; padding: 15px 40px 40px; }
            .side-panel { width: 450px; flex-shrink: 0; }
            .preview-panel { flex: 1; max-width: 850px; display: flex; flex-direction: column; }
            .preview-area { height: 100%; display: flex; flex-direction: column; }
        }

        .card {
            background: var(--card-bg); padding: 25px; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; box-sizing: border-box;
            border: 1px solid var(--panel-border); height: 100%;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--input-border);
            border-radius: 12px; box-sizing: border-box; background: var(--bg);
            color: var(--text-main); font-family: inherit; font-size: 0.95rem;
        }

        .btn-search {
            background: #8e8e93; color: white; font-weight: bold; cursor: pointer;
            border: none; padding: 12px; width: 100%; border-radius: 12px; margin-top: 5px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .preview-area {
            background: var(--card-bg); border-radius: 24px; padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; box-sizing: border-box;
            display: none; border: 1px solid var(--panel-border);
        }
        
        .canvas-container { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            overflow: hidden; margin-bottom: 20px; background: rgba(0,0,0,0.03); border-radius: 16px;
        }

        canvas { 
            max-width: 100%; max-height: 100%; height: auto; border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
        }

        .download-btn {
            background: var(--success); color: white; border: none;
            padding: 18px; border-radius: 14px; font-weight: bold; width: 100%;
            cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: auto;
        }

        .style-panel { background: var(--panel-bg); padding: 18px; border-radius: 16px; border: 1px solid var(--panel-border); margin-top: 10px; }
        .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; display: none; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #status { font-size: 0.8rem; text-align: center; margin: 10px 0; color: #ff3b30; min-height: 1.2em; }
        .footer { padding: 30px; font-size: 0.7rem; color: var(--text-secondary); opacity: 0.6; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <button class="theme-toggle" id="themeToggle">🌓 Тема оформления</button>
</div>

<div class="main-container">
    <div class="side-panel">
        <div class="card">
            <div class="input-group">
                <label>📸 Фотография</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="input-group">
                <label>🔍 Поиск адреса</label>
                <input type="text" id="addressSearch" placeholder="Напр: Москва, Лескова 5">
                <button type="button" id="getCoordsBtn" class="btn-search">
                    <span class="spinner" id="searchSpinner"></span>
                    <span>Найти данные</span>
                </button>
                <div id="status"></div>
            </div>

            <div class="input-group">
                <label>📅 Дата и время</label>
                <input type="text" id="dateInput">
            </div>

            <div class="input-group">
                <label>🏠 Адрес</label>
                <input type="text" id="addressDisplay">
            </div>

            <div class="input-group">
                <label>🌐 Координаты</label>
                <input type="text" id="coordsInput">
            </div>

            <div class="input-group">
                <label>✍️ Текст снизу</label>
                <textarea id="extraTextInput" rows="2">Северо-Восточный административный округ&#10;Москва</textarea>
            </div>

            <div class="style-panel">
                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Цвет текста</label>
                        <input type="color" id="textColor" value="#fff9c4" style="height: 30px; width: 50px; border: none; cursor: pointer; background: none;">
                    </div>
                </div>
                
                <div class="style-grid">
                    <div class="input-group">
                        <label>Размер: <span id="fontSizeVal">3.5</span>%</label>
                        <input type="range" id="fontSize" min="1" max="10" step="0.1" value="3.5">
                    </div>
                    <div class="input-group">
                        <label>Вес: <span id="fontWeightVal">700</span></label>
                        <input type="range" id="fontWeight" min="100" max="900" step="100" value="700">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 0;">
                    <label>Толщина обводки: <span id="strokeWeightVal">0.15</span></label>
                    <input type="range" id="strokeWeight" min="0" max="0.5" step="0.01" value="0.15">
                </div>
            </div>
        </div>
    </div>

    <div class="preview-panel">
        <div class="preview-area" id="previewArea">
            <label style="margin-bottom: 10px; display: block; text-align: center;">👀 Результат:</label>
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            <button id="downloadBtn" class="download-btn">⬇ Скачать готовое фото</button>
        </div>
    </div>
</div>

<div class="footer">picturegps v1.0 by Fedorazzz 2026</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewArea = document.getElementById('previewArea');
    const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    let sourceImg = null;

    function translit(word) {
        const dict = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'j','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        return word.split('').map(c => dict[c.toLowerCase()] || c).join('');
    }

    function getCleanFilename() {
        const dateStr = document.getElementById('dateInput').value;
        const dateMatch = dateStr.match(/(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
        let ts = dateMatch ? `${dateMatch[1]}${dateMatch[2]}${dateMatch[3].slice(-2)}${dateMatch[4]}${dateMatch[5]}` : "file";
        let addr = document.getElementById('addressDisplay').value;
        let clean = translit(addr).replace(/(ulitsa|prospekt|shosse|dom|d\.)/gi, '').replace(/[^a-z0-9]/gi, '');
        return `${ts}_${clean}.jpg`;
    }

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.onclick = () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    };
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

    const d = new Date();
    document.getElementById('dateInput').value = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

    function render() {
        if (!sourceImg) return;
        previewArea.style.display = "flex";
        canvas.width = sourceImg.width; canvas.height = sourceImg.height;
        ctx.drawImage(sourceImg, 0, 0);

        const fs = Math.round(canvas.height * (parseFloat(document.getElementById('fontSize').value) / 100));
        const fw = document.getElementById('fontWeight').value;
        const sw = parseFloat(document.getElementById('strokeWeight').value);
        
        ctx.font = `${fw} ${fs}px Arial, sans-serif`;
        ctx.fillStyle = document.getElementById('textColor').value;
        ctx.textAlign = "right";
        ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = fs/10;
        ctx.strokeStyle = "black"; 
        ctx.lineWidth = fs * sw;

        const dateVal = document.getElementById('dateInput').value;
        const m = dateVal.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})$/);
        const fDate = m ? `${parseInt(m[1])} ${months[parseInt(m[2])-1]} ${m[3]} время: ${m[4]}:${m[5]}` : dateVal;

        const lines = [fDate, document.getElementById('addressDisplay').value, document.getElementById('coordsInput').value, ...document.getElementById('extraTextInput').value.split('\n')].filter(l => l && l.trim() !== "").reverse();
        
        const padding = fs * 0.9;
        lines.forEach((line, i) => {
            const y = canvas.height - padding - (i * fs * 1.4);
            if(sw > 0) ctx.strokeText(line, canvas.width - padding, y);
            ctx.fillText(line, canvas.width - padding, y);
        });
    }

    document.getElementById('downloadBtn').onclick = () => {
        canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = getCleanFilename(); a.click();
            URL.revokeObjectURL(url);
        }, 'image/jpeg', 0.95);
    };

    document.getElementById('getCoordsBtn').onclick = async () => {
        const q = document.getElementById('addressSearch').value;
        if(!q) return;
        document.getElementById('searchSpinner').style.display = "inline-block";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(q)}&limit=1`, { headers: {'Accept-Language': 'ru'} });
            const data = await res.json();
            if (data.length > 0) {
                const a = data[0].address;
                document.getElementById('addressDisplay').value = `${a.house_number || ""} ${a.road || a.suburb || ""}`.trim();
                document.getElementById('coordsInput').value = `${parseFloat(data[0].lat).toFixed(6)}, ${parseFloat(data[0].lon).toFixed(6)}`;
                render();
            }
        } catch (e) { document.getElementById('status').innerText = "Ошибка поиска"; }
        document.getElementById('searchSpinner').style.display = "none";
    };

    document.getElementById('imageInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            sourceImg = new Image();
            sourceImg.onload = render;
            sourceImg.src = ev.target.result;
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    ['dateInput', 'addressDisplay', 'coordsInput', 'extraTextInput', 'textColor', 'fontSize', 'fontWeight', 'strokeWeight'].forEach(id => {
        document.getElementById(id).oninput = () => {
            document.getElementById(id + 'Val') && (document.getElementById(id + 'Val').innerText = document.getElementById(id).value);
            render();
        };
    });
});
</script>
</body>
</html>
